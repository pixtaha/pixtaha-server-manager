<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/pixtaha-design-system-9866b6ad-c65c-403d-bcae-aebf6aa6db08/styles.css">
  
  <style>body{margin:0;background:var(--color-surface-sunken)}a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}</style>
</helmet>
<div style="padding:64px;font-family:var(--font-sans);color:var(--color-text);display:flex;flex-direction:column;gap:56px;min-width:max-content">
  <div style="display:flex;flex-direction:column;gap:12px;max-width:760px">
    <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;color:var(--color-text-subtle)">PIXTAHA MANAGEMENT · DELIVERABLE 2</div>
    <h1 style="margin:0;font-size:44px;line-height:1.12;font-weight:400;letter-spacing:-0.025em">Login</h1>
    <p style="margin:0;font-size:16px;line-height:1.6;color:var(--color-text-muted)">Passkey first, password + TOTP as fallback, first-time setup in three steps. Code boxes accept typing and paste.</p>
  </div>
  <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="font-size:20px;font-weight:500">{{ row.title }}</div>
      <div style="display:flex;gap:40px;align-items:flex-start">
        <sc-for list="{{ row.items }}" as="it" hint-placeholder-count="3">
          <div id="{{ it.id }}" style="display:flex;flex-direction:column;gap:12px;flex:none;width:{{ it.w }}">
            <div style="display:flex;gap:10px;align-items:center"><span style="padding:4px 10px;border-radius:999px;background:var(--color-text);color:var(--color-bg);font-family:var(--font-mono);font-size:12px">{{ it.id }}</span><span style="font-size:15px;color:var(--color-text-muted)">{{ it.name }}</span></div>
            <div style="width:{{ it.w }};height:{{ it.h }};border-radius:16px;overflow:hidden;border:1px solid var(--color-border)">
              <dc-import name="Auth Screen" screen="{{ it.screen }}" device="{{ it.device }}" theme="dark" hint-size="100%,100%" style="width:100%;height:100%"></dc-import>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const d = (id, screen, name) => ({ id, screen, name, device: 'desktop', w: '1440px', h: '900px' });
    const m = (id, screen, name) => ({ id, screen, name, device: 'mobile', w: '375px', h: '812px' });
    return { rows: [
      { title: 'Sign in · 1440 dark', items: [d('L1','passkey','Passkey (primary)'), d('L2','password','Password fallback'), d('L3','totp','Authenticator code')] },
      { title: 'States · 1440 dark', items: [d('L4','totp-error','Wrong code'), d('L5','rate-limited','Rate limited'), d('L6','passkey-unavailable','Passkey not available')] },
      { title: 'First-time setup · 1440 dark', items: [d('S1','setup-passkey','1 · Register passkey'), d('S2','setup-totp','2 · Authenticator'), d('S3','setup-codes','3 · Backup codes')] },
      { title: '375 mobile', items: [m('M1','passkey','Passkey'), m('M2','totp-error','Code · wrong'), m('M3','rate-limited','Rate limited'), m('M4','setup-totp','Authenticator'), m('M5','setup-codes','Backup codes')] }
    ] };
  }
}
</script>
</body>
</html>
